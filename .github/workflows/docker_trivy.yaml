name: "Docker CI Workflow"

on:
  push:
   branches:
   - main
   paths:
   - docker_python/**
  workflow_dispatch:

env:
  APP_NAME: financeplanner
  APP_VERSION: "1.1.0"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            # Tags the image exactly with the APP_VERSION variable above
            type=raw,value=${{ env.APP_VERSION }}
            # Always tags the image as 'latest' on every push to main
            type=raw,value=latest
            
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 2. Build and LOAD the image locally (Do not push yet)
      - name: Build and load local image
        uses: docker/build-push-action@v7
        with:
          context: ./docker_python
          load: true 
          tags: ${{ steps.meta.outputs.tags }}

      # 3. Scan the local image with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}'
          format: 'table'
          exit-code: '1'          # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true    # Ignores vulnerabilities that do not have a fix available yet
          vuln-type: 'os,library' # Scans both OS packages and application dependencies
          severity: 'CRITICAL'    # Only looks for CRITICAL severities

      # 4. Push the image (Only executes if the Trivy scan passes)
      - name: Push image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./docker_python
          push: true
          tags: ${{ steps.meta.outputs.tags }}