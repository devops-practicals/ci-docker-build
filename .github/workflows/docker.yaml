name: "Docker CI Workflow"

on:
  push:
   branches:
   - main
   paths:
   - docker_python/**
    # Trigger the workflow only when you push a Git tag that matches SemVer (e.g., v1.0.0, v2.1.3)
  #  tags:
  #  - 'v*.*.*'

env:
  APP_NAME: financeplanner

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 1. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            # SemVer tags (only active when triggered by a Git Tag)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Fallback tag for main branch pushes (creates 'latest' tag)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Optional: Add the short commit SHA as a tag for trackability
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker_python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # platforms: linux/amd64,linux/arm64